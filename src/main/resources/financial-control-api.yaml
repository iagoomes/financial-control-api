openapi: 3.0.3
info:
  title: Controle Financeiro API
  description: API para análise de extratos bancários e controle financeiro pessoal
  version: 1.0.0
tags:
  - name: Extracts
    description: Operações relacionadas ao processamento de extratos
  - name: Transactions
    description: Operações relacionadas às transações
  - name: Categories
    description: Operações relacionadas às categorias
  - name: Reports
    description: Relatórios e análises financeiras
  - name: Users
    description: Operações de cadastro e gestão de usuários
paths:
  /users:
    post:
      tags:
        - Users
      summary: Cria um novo usuário
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Usuário criado com sucesso
          headers:
            Location:
              description: URL do recurso criado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: E-mail já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Users
      summary: Lista usuários
      operationId: listUsers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
          description: Página (0-based)
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
          description: Tamanho da página
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDTO'

  /users/{userId}:
    get:
      tags:
        - Users
      summary: Busca usuário por ID
      operationId: getUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '404':
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Users
      summary: Atualiza campos do usuário
      operationId: updateUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: E-mail já cadastrado para outro usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Users
      summary: Remove usuário por ID
      operationId: deleteUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removido com sucesso
        '404':
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{userId}/extracts/upload:
    post:
      tags:
        - Extracts
      summary: Upload e processa extrato bancário do usuário
      description: Recebe um arquivo PDF ou CSV do extrato do usuário e retorna as transações processadas
      operationId: uploadUserExtract
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do usuário proprietário do extrato
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo do extrato (PDF ou CSV)
                bank:
                  type: string
                  enum: [NUBANK, ITAU, BRADESCO, SANTANDER, CAIXA, BB]
                  description: Banco emissor do extrato
                  example: NUBANK
                month:
                  type: integer
                  minimum: 1
                  maximum: 12
                  description: Mês de referência do extrato
                  example: 7
                year:
                  type: integer
                  minimum: 2015
                  maximum: 2040
                  description: Ano de referência do extrato
                  example: 2025
      responses:
        '200':
          description: Extrato processado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractAnalysisResponse'
        '400':
          description: Arquivo inválido ou parâmetros incorretos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{userId}/extracts/{extractId}:
    get:
      tags:
        - Extracts
      summary: Busca análise de extrato por ID do usuário
      operationId: getUserExtractById
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do usuário proprietário do extrato
        - name: extractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID único do extrato processado
      responses:
        '200':
          description: Análise do extrato encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractAnalysisResponse'
        '404':
          description: Extrato não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{userId}/extracts:
    get:
      tags:
        - Extracts
      summary: Lista extratos processados do usuário
      operationId: listUserExtracts
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do usuário
        - name: bank
          in: query
          schema:
            type: string
            enum: [NUBANK, ITAU, BRADESCO, SANTANDER, CAIXA, BB]
          description: Filtrar por banco
        - name: year
          in: query
          schema:
            type: integer
          description: Filtrar por ano
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: Filtrar por mês
      responses:
        '200':
          description: Lista de extratos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExtractSummary'

  /users/{userId}/transactions/{transactionId}/categorize:
    patch:
      tags:
        - Transactions
      summary: Atualiza categoria de uma transação do usuário
      operationId: categorizeUserTransaction
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateRequest'
      responses:
        '200':
          description: Categoria atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDTO'
        '404':
          description: Transação não encontrada

  /users/{userId}/categories:
    get:
      tags:
        - Categories
      summary: Lista categorias disponíveis do usuário
      operationId: listUserCategories
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de categorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryDTO'

  /users/{userId}/reports/monthly:
    get:
      tags:
        - Reports
      summary: Relatório mensal de gastos do usuário
      operationId: getUserMonthlyReport
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 2015
            maximum: 2040
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: Relatório mensal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyReportDTO'
components:
  schemas:
    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 180
      required:
        - name
        - email
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 180
    UserDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - createdAt

    ExtractAnalysisResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID único do extrato processado
        bank:
          type: string
          enum: [NUBANK, ITAU, BRADESCO, SANTANDER, CAIXA, BB]
        period:
          $ref: '#/components/schemas/PeriodDTO'
        summary:
          $ref: '#/components/schemas/FinancialSummary'
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionDTO'
        categoryBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/CategorySummary'
        processedAt:
          type: string
          format: date-time
      required:
        - id
        - bank
        - period
        - summary
        - transactions
        - categoryBreakdown
        - processedAt

    TransactionDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: Data da transação
          example: "2025-07-30"
        title:
          type: string
          description: Descrição/estabelecimento da transação
          example: "Mercantil Red"
        amount:
          type: number
          format: double
          description: Valor da transação (positivo para gastos, negativo para entradas)
          example: 30.71
        category:
          $ref: '#/components/schemas/CategoryDTO'
        originalDescription:
          type: string
          description: Descrição original do extrato
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Confiança na categorização automática
      required:
        - id
        - date
        - title
        - amount
        - Category

    CategoryDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Alimentação"
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#FF6B6B"
        icon:
          type: string
          example: "🍽️"
        parentCategoryId:
          type: string
          format: uuid
          nullable: true
      required:
        - id
        - name
        - color

    FinancialSummary:
      type: object
      properties:
        totalIncome:
          type: number
          format: double
          description: Total de entradas no período
          example: 148.74
        totalExpenses:
          type: number
          format: double
          description: Total de gastos no período
          example: 2340.50
        netAmount:
          type: number
          format: double
          description: Saldo líquido (entradas - gastos)
          example: -2191.76
        transactionCount:
          type: integer
          description: Número total de transações
          example: 26
        averageTransactionValue:
          type: number
          format: double
          description: Valor médio das transações
      required:
        - totalIncome
        - totalExpenses
        - netAmount
        - transactionCount

    CategorySummary:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/CategoryDTO'
        totalAmount:
          type: number
          format: double
          description: Total gasto na categoria
        transactionCount:
          type: integer
          description: Número de transações na categoria
        percentage:
          type: number
          format: double
          description: Percentual do total de gastos
          minimum: 0
          maximum: 100
        averageAmount:
          type: number
          format: double
          description: Valor médio por transação na categoria
      required:
        - category
        - totalAmount
        - transactionCount
        - percentage

    PeriodDTO:
      type: object
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
          example: 7
        year:
          type: integer
          example: 2025
        startDate:
          type: string
          format: date
          example: "2025-07-01"
        endDate:
          type: string
          format: date
          example: "2025-07-31"
      required:
        - month
        - year
        - startDate
        - endDate

    ExtractSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bank:
          type: string
          enum: [NUBANK, ITAU, BRADESCO, SANTANDER, CAIXA, BB]
        period:
          $ref: '#/components/schemas/PeriodDTO'
        totalExpenses:
          type: number
          format: double
        totalIncome:
          type: number
          format: double
        transactionCount:
          type: integer
        processedAt:
          type: string
          format: date-time
      required:
        - id
        - bank
        - period
        - totalExpenses
        - totalIncome
        - transactionCount
        - processedAt

    CategoryUpdateRequest:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
          description: ID da nova categoria
      required:
        - categoryId

    MonthlyReportDTO:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/PeriodDTO'
        summary:
          $ref: '#/components/schemas/FinancialSummary'
        categoryBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/CategorySummary'
        dailyExpenses:
          type: array
          items:
            $ref: '#/components/schemas/DailyExpenseDTO'
        topExpenses:
          type: array
          items:
            $ref: '#/components/schemas/TransactionDTO'
          maxItems: 10

    DailyExpenseDTO:
      type: object
      properties:
        date:
          type: string
          format: date
        totalAmount:
          type: number
          format: double
        transactionCount:
          type: integer
      required:
        - date
        - totalAmount
        - transactionCount

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Código do erro
        message:
          type: string
          description: Mensagem descritiva do erro
        details:
          type: array
          items:
            type: string
          description: Detalhes adicionais do erro
        timestamp:
          type: string
          format: date-time
      required:
        - error
        - message
        - timestamp

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
